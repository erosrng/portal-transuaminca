version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build --force
  artifacts:
    # This is the key part!
    baseDirectory: /dist/portal-transuaminca/browser # <--- **CHANGE THIS** to where index.html is
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
